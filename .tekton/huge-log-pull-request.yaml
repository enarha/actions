apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/enarha/actions?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: actions
    appstudio.openshift.io/component: actions
  name: huge-log-generate-on-pull-request
  namespace: enatan-tenant
spec:
  pipelineSpec:
    tasks:
    - name: log-generator
      taskSpec:
        steps:
        - name: generate-log
          image: alpine
          script: |
            for i in $(seq 1 5000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 5001 10000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 10001 15000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 15001 20000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 20001 25000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 25001 30000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 30001 35000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
            sleep 180
            for i in $(seq 35001 40000); do echo -n "$i "; cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -1; done
